<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240"><title>Equal speeds, opposite velocities</title><desc>Two cyclists travel at 5 metres per second. The upper cyclist heads east, positive 5 metres per second; the lower heads west, negative 5 metres per second.</desc><style>text{font-family:Courier New,monospace;fill:#e5e0d3;font-size:15px}.muted{fill:#aba89e;font-size:12px}.road{stroke:#6b6657;stroke-width:2;fill:none}.velocity{stroke:#d7c39a;stroke-width:3;fill:none;marker-end:url(#v)}.acceleration{stroke:#b9c8a2;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#d7c39a"/></marker><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b9c8a2"/></marker></defs><path class="road" d="M40 100H560M40 196H560" stroke-dasharray="5 7"/><text x="40" y="28" class="muted">WEST</text><text x="460" y="28" class="muted">EAST / +</text><path class="velocity" d="M270 58H435"/><path class="velocity" d="M330 154H165"/><text x="295" y="45">+5 m/s</text><text x="200" y="140">−5 m/s</text><g id="bike" stroke="#e5e0d3" stroke-width="2" fill="none"><circle cx="205" cy="81" r="17"/><circle cx="259" cy="81" r="17"/><path d="m205 81 17-30 18 30h-35m17-30h25l12 30m-40-38h13m9-2h10l-4 10m-15-10 7-14 12 8m-12-8-13 11"/><circle cx="244" cy="16" r="6"/></g><use href="#bike" transform="translate(600 96) scale(-1 1)"/><text x="300" y="228" text-anchor="middle" class="muted">Same magnitude. Different direction.</text></svg>