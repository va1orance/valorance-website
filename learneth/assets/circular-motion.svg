<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330"><title>Constant speed around a circular track</title><desc>A car at the right of a circular track has an upward tangential velocity of 20 metres per second and inward acceleration pointing left. At the top, velocity points left and acceleration points down toward the centre.</desc><style>text{font-family:Courier New,monospace;fill:#e5e0d3;font-size:15px}.muted{fill:#aba89e;font-size:12px}.road{stroke:#6b6657;stroke-width:2;fill:none}.velocity{stroke:#d7c39a;stroke-width:3;fill:none;marker-end:url(#v)}.acceleration{stroke:#b9c8a2;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#d7c39a"/></marker><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b9c8a2"/></marker></defs><circle cx="260" cy="165" r="105" class="road"/><circle cx="260" cy="165" r="93" class="road" stroke-dasharray="4 8" opacity=".5"/><circle cx="260" cy="165" r="3" fill="#aba89e"/><text x="244" y="187" class="muted">centre</text><path d="M365 165H260M260 60V165" class="road" stroke-dasharray="4 6"/><rect x="357" y="152" width="16" height="26" rx="4" fill="#d7c39a"/><rect x="247" y="52" width="26" height="16" rx="4" fill="#d7c39a"/><path class="velocity" d="M365 146V61"/><path class="velocity" d="M242 60H156"/><path class="acceleration" d="M351 165H291"/><path class="acceleration" d="M260 75V137"/><text x="381" y="97">20 m/s</text><text x="155" y="38">20 m/s</text><text x="285" y="205" class="muted">inward</text><text x="300" y="306" text-anchor="middle" class="muted">Velocity: tangent to the track</text><text x="300" y="325" text-anchor="middle" class="muted" style="fill:#b9c8a2">Acceleration: toward the centre</text></svg>